# Nginx WebSocket 反向代理配置
# 用于代理 Stake 和 Winna WebSocket 服务
# 
# 使用方法：
# 1. 将此文件复制到 /etc/nginx/sites-available/websocket
# 2. 修改域名和证书路径
# 3. 创建软链接：ln -s /etc/nginx/sites-available/websocket /etc/nginx/sites-enabled/
# 4. 测试配置：nginx -t
# 5. 重载配置：systemctl reload nginx

# 使用 map 指令来区分 WebSocket 和 HTTP 请求
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# WebSocket 服务配置（Stake + Winna）
# 使用同一个域名，通过路径区分服务
server {
    listen 443 ssl http2;
    server_name stakefav.xyz www.stakefav.xyz;  # 你的域名（包含 www 和非 www）
    
    # SSL 证书配置（Let's Encrypt）
    ssl_certificate /etc/letsencrypt/live/stakefav.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stakefav.xyz/privkey.pem;
    
    # SSL 优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # 脚本文件服务（油猴脚本自动更新）- 路径：/scripts/
    # 注意：必须在其他 location 之前，因为 Nginx 按最长前缀匹配
    location /scripts/ {
        alias /var/www/stake_code/scripts/;
        default_type text/javascript;
        charset utf-8;
        
        # 缓存控制（禁止缓存，确保更新及时）
        add_header Cache-Control 'no-cache, no-store, must-revalidate';
        add_header Pragma 'no-cache';
        add_header Expires '0';
        
        # 允许跨域（油猴需要）
        add_header Access-Control-Allow-Origin '*';
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
        add_header Access-Control-Allow-Headers 'Content-Type';
        
        # 支持 OPTIONS 预检请求
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
    
    # Winna WebSocket 服务（端口 8766）- 路径：/winna
    location /winna {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        
        # WebSocket 必需的头信息
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket 超时设置
        proxy_read_timeout 86400;  # 24小时
        proxy_send_timeout 86400;
        proxy_connect_timeout 60;
        
        # 缓冲设置（WebSocket 不需要缓冲）
        proxy_buffering off;
    }
    
    # 静态文件服务（必须在 Django 路由之前）
    location /static/ {
        alias /root/stake_code/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Django Admin（必须在根路径之前）
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Django 前台路由（必须在根路径之前）
    location ~ ^/(login|register|accounts|balance|billing|logout)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 根路径和其他路径的统一处理
    # 注意：由于 Nginx 的限制，在 if 块内不能使用 proxy_http_version 等指令
    # 所以我们使用两个 location 块：一个处理 WebSocket（通过检查 Upgrade 头），一个处理 HTTP
    # 但由于 location 匹配顺序，我们需要使用 if 来判断
    # 实际上，最简单的方法是：在 location 级别设置所有 WebSocket 配置，然后在 if 块内只使用 proxy_pass
    # 这样 WebSocket 头部也会应用到 HTTP 请求，但 HTTP 会忽略这些头部
    
    # 根路径和其他路径的统一处理
    location / {
        # 设置 WebSocket 配置（所有请求都会应用，但只有 WebSocket 请求会使用）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;  # 24小时
        proxy_send_timeout 86400;
        proxy_connect_timeout 60;
        proxy_buffering off;
        
        # 如果是 WebSocket 请求（有 Upgrade 头），转发到 WebSocket 服务
        if ($http_upgrade) {
            proxy_pass http://127.0.0.1:8765;
            break;
        }
        
        # 普通 HTTP 请求，转发到 Django
        proxy_pass http://127.0.0.1:8000;
    }
    
    # 访问日志
    access_log /var/log/nginx/websocket_access.log;
    error_log /var/log/nginx/websocket_error.log;
}

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name stakefav.xyz www.stakefav.xyz;  # 你的域名（包含 www 和非 www）
    
    # Let's Encrypt 验证路径（不要删除）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

