{% extends 'frontend/base.html' %}

{% block title %}余额查询 - Stake Code Claim Tool{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-wallet2"></i> 余额查询</h2>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body text-center">
                <h5 class="card-title text-muted">当前余额</h5>
                <h1 class="display-4 text-primary">¥ 0.00</h1>
                <p class="text-muted">余额功能开发中...</p>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body">
                <h5 class="card-title"><i class="bi bi-info-circle"></i> 说明</h5>
                <ul class="list-unstyled">
                    <li><i class="bi bi-check-circle text-success"></i> 余额功能将在第二阶段开发</li>
                    <li><i class="bi bi-check-circle text-success"></i> 支持预充值功能</li>
                    <li><i class="bi bi-check-circle text-success"></i> 支持费率配置</li>
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}
