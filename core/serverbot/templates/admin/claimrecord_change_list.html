{% extends "admin/change_list.html" %}

{% block result_list %}
    <!-- 统计信息显示在表格上方（红框位置） -->
    <div style="margin-bottom: 15px; padding: 15px; background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 5px;">
        <div style="display: flex; gap: 30px; align-items: center; flex-wrap: wrap;">
            <div>
                <strong style="color: #6c757d;">总记录数：</strong>
                <span style="font-size: 18px; color: #495057;">{{ total_records|default:0 }}</span>
            </div>
            <div>
                <strong style="color: #6c757d;">成功记录数：</strong>
                <span style="font-size: 18px; color: #28a745;">{{ success_count|default:0 }}</span>
            </div>
            <div>
                <strong style="color: #6c757d;">领取总金额：</strong>
                <span style="font-size: 24px; font-weight: bold; color: #28a745;">${{ total_amount|default:0|floatformat:2 }}</span>
            </div>
        </div>
        <p style="margin-top: 10px; margin-bottom: 0; color: #6c757d; font-size: 12px;">
            * 总金额仅统计状态为"领取成功"且有奖金金额的记录，基于当前筛选结果
        </p>
    </div>
    
    {{ block.super }}
{% endblock %}
